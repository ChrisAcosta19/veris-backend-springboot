# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Spring Application Name
spring.application.name=veris-backend-springboot

# Database Configuration is handled by OracleDataSourceConfig class
# which constructs the JDBC URL dynamically based on:
# - DB_SERVICE_NAME (for CloudClusters): jdbc:oracle:thin:@host:port/service_name
# - DB_SID (for local): jdbc:oracle:thin:@host:port:sid

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
veris.jwt.secret=${JWT_SECRET:default_secret}
veris.jwt.expiration=3600

# Logging
logging.level.root=INFO
logging.level.com.veris=DEBUG
logging.level.org.springframework.security=DEBUG

# Springdoc OpenAPI Configuration (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
